# ─────────────────────────────────────────────────────────────────
#  CCENA — Netlify configuration
#  Deploy: push to repo → Netlify auto-builds
# ─────────────────────────────────────────────────────────────────

[build]
  publish = "."                    # index.html is at the repo root
  functions = "netlify/functions"  # serverless functions directory

[build.environment]
  NODE_VERSION = "18"              # Required for native fetch in functions

# ── Security headers ──────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy   = "default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://api.anthropic.com https://api.sendgrid.com;"

# ── Single-page app: serve index.html for all routes ─────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
